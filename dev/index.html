<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0,viewport-fit=cover"
  >

  <title>Edgewood Survey Tool</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="./icons/foe-icon-192.png">
  <link rel="apple-touch-icon" href="./icons/foe-icon-192.png">

  <meta name="theme-color" content="#4a7c59">

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SurveyTool">

  <!-- Older Android support -->
  <meta name="mobile-web-app-capable" content="yes">

<!-- CSS -->
  <style>

/* Base */
    html {
      height: 100%;
      overflow: hidden;
      font-size: 100%;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
      padding-top: calc(env(safe-area-inset-top) + 8px);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
      padding-left: calc(env(safe-area-inset-left, 0px) + 4px);
      padding-right: calc(env(safe-area-inset-right, 0px) + 4px);
      font-size: 1rem;
      line-height: 1.25;
      touch-action: manipulation;
    }

    [hidden] {
      display: none !important;
    }

    #globalHeader {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* top row */
    .headerTop {
      display: flex;
      align-items: center;
      gap: clamp(8px, calc(3.33vw - 2.67px), 12px);
    }

/* logo + title group */
    .headerIdentity {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      gap: clamp(8px, calc(3.33vw - 2.67px), 12px);
    }

    #foeLogo {
      height: clamp(38px, calc(10vw + 6px), 50px);
      width: auto;
      display: block;
    }

    .title {
      flex: 1 1 auto;
      min-width: max-content;
      text-align: center;
      white-space: nowrap;
      font-size: clamp(16px, calc(3.33vw + 8.53px), 0.9rem);
      line-height: 1;
      font-weight: 600;
    }

    .headerMeta {
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      align-items: flex-end;
      line-height: 1.1;
      text-align: right;
    }

    #version {
      font-size: clamp(0.8rem, calc(1.33vw + 8.53px), 0.9rem);;
      white-space: nowrap;
    }

    #status {
      font-size: clamp(0.9rem, calc(1.33vw + 10.13px), 1rem);
      white-space: nowrap;
    }


    /* bottom row */
    .headerActions {
      display: flex;
      flex-wrap: wrap;   /* allows graceful wrap instead of breaking layout */
      gap: 4px;
    }

    .headerActions button,
    .headerActions select {
      padding: 4px 8px;
      font-size: 0.8em;
    }

/* messages */
    #stateMessagePanel {
      padding: 8px 10px;
      border: 1px solid #d8b45a;
      background: #fff7d6;
      font-size: 0.9rem;
      line-height: 1.25;
    }
    /* if we decide we need #bootFallback or #messagePanel, they go here */

/* logView */

    #logView {
      position: relative;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    #searchArea {
      position: relative;
      flex: 0 0 auto;
      background: #f5f5f5;
      padding-top: 6px;
      z-index: 100;
    }

    #search {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      padding: 6px 38px 6px 10px;
      margin-bottom: 6px;
    }

    #clearSearch {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      font-size: 22px;
      padding: 6px;
      cursor: pointer;
    }

    #logTrailSelect {
      flex: 0 0 auto;
    }

    #log {
      flex: 1 1 auto;
      overflow-y: auto;
      min-height: 0;
    }

    .item {
      padding: 10px;
      border-bottom: 1px solid #eee;
      line-height: 1.3;
    }

    .resultItem {
      padding: 12px 10px;
      line-height: 1.25;
      border-bottom: 1px solid #ddd;
      background: #f8fbff;
    }

    #results {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 1000;
      overflow-y: auto;
      background: #eef5ff;
      display: none;
    }

    #results:not(:empty) {
      display: block;
    }

    .common {
      font-weight: bold;
      margin-right: 6px;
    }

    .scientific {
      font-style: italic;
    }

    .logRow {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    
    .logNote {
      flex: 0 1 auto;

      min-width: 5ch;
      max-width: 50%;

      resize: none;
      overflow: hidden;
      font: inherit;
      line-height: inherit;
      white-space: pre;
      overflow-wrap: anywhere;
      padding-top: 0;
      padding-bottom: 0;
      padding-left: 4px;
      padding-right: 4px;

      box-sizing: border-box;
      vertical-align: top;
    }

    /* "x" delete button for log entries */
    .deleteBtn {
      flex: 0 0 auto;
      font-size: 18px;
      padding: 2px 8px;
      margin-left: 4px;
      border: none;
      border-radius: 6px;
      background: #eee;
      color: #900;
      cursor: pointer;
    }

    textarea,
    select,
    input {
      font-size: 16px;
      width: 100%;
    }

    select, input {
      padding: 12px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    .headerActions select {
      width: auto;
      margin-bottom: 0;
    }

    textarea {
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      resize: vertical;
    }

    .resultItem .scientific {
      font-size: 0.9em;
    }

    .resultItem:active {
      background: #dcecff;
    }

    .activeNoteBtn {
      background: #dcecff;
    }

    .item:last-child {
      border-bottom: none;
    }

/* Notes View */

    #notesView {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    #notesPanel > input,
    #notesPanel > textarea,
    .participantWrapper,
    .participantWrapper textarea {
      box-sizing: border-box;
      max-width: 100%;
      width: 100%;
    }

    .longNote {
      min-height: 8em;
    }

    .participantResults {
      position: absolute;
      left: 0;
      right: 0;
      background: #eef5ff;
      border: 1px solid #ccc;
      max-height: 200px;
      overflow-y: auto;
      z-index: 2000;
    }
    .participantWrapper {
      position: relative;
    }
    #participants {
      width: 100%;
      resize: vertical;
      min-height: 2.5em;
    }

    .surveyTimeRow {
      display: grid;
      grid-template-columns: max-content max-content minmax(0, 1fr);
      column-gap: 0.35rem;
      align-items: center;
      width: 100%;
    }

    .surveyTimeRow label,
    .surveyTimeRow input {
      font: inherit;
      line-height: 1.25;
    }

    .surveyTimeRow input {
      box-sizing: border-box;
      min-width: 0;
      padding: 8px 4px;
      margin-bottom: 0;
    }

/* Choice dialog */
    .choiceOverlay {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: calc(env(safe-area-inset-top) + 72px) 12px 12px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.18);
    }

    .choicePanel {
      width: min(100%, 360px);
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: white;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22);
    }

    .choiceQuestion {
      margin-bottom: 10px;
      font-weight: 600;
    }

    .choiceButtons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

/* Feedback / Utility */
    .inputRejected {
      background: #ffeaea;
    }

  </style>
</head>

<body>

  <div id="bootFallback">
    Survey Tool did not finish loading.
    Find network coverage and reopen the app.
  </div>

  <div id="globalHeader" hidden>

    <div class="headerTop">
      <div class="headerIdentity">
        <img id="foeLogo" src="./icons/foe-logo.png" alt="FoE logo">
        <div class="title">Survey Tool</div>
      </div>

      <div class="headerMeta">
        <div id="version"></div>
        <div id="status"></div>
      </div>
    </div>

    <div class="headerActions">
      <select id="viewSelect" aria-label="View" hidden>
        <option value="log">Log</option>
        <option value="notes">Notes</option>
        <option value="route" disabled>Route</option>
      </select>
      <button id="newBtn" hidden>New Survey</button>
      <button id="refreshBtn" hidden>Refresh</button>
      <button id="endBtn" hidden>End</button>
      <button id="saveBtn" hidden>Save</button>
      <button id="importBtn" hidden>Import</button>
      <input id="importInput" type="file"
        accept="application/json,.json" hidden >
    </div>

  </div> <!-- #globalHeader -->

  <div id="messagePanel" hidden>
    <span id="messageText"></span>
    <button id="dismissMessageBtn"
      aria-label="Dismiss message">
      x 
    </button>
  </div>

  <div id="stateMessagePanel" hidden></div>


  <div id="logView" hidden>

    <!-- search stays fixed under header -->
    <div id="searchArea">
      <input
        disabled
        id="search"
        type="text"
        placeholder="Search plant..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      >
      <button id="clearSearch" type="button" aria-label="Clear search">
        X
      </button>
    </div>

    <!-- normal content -->
    <select id="logTrailSelect"></select>

    <div id="log"></div>

    <!-- overlays selector + log -->
    <div id="results"></div>

  </div> <!-- #logView -->

  <div id="notesView" hidden>
    <div id="notesPanel">
      <input id="date" aria-label="Survey date">

      <div class="participantWrapper">
        <textarea id="participants" rows="2" placeholder="Participants"
          aria-label="Participants">
        </textarea>
        <div id="participantResults" class="participantResults" ></div>
      </div>

      <div class="surveyTimeRow">
        <label for="startTime">Start</label>
        <input id="startTime">
        <input id="startWeather" placeholder="55 F, partly cloudy" 
          aria-label="Starting weather">
      </div>

      <div class="surveyTimeRow">
        <label for="endTime">End</label>
        <input id="endTime">
        <input id="endWeather" placeholder="88 F, sunny"
          aria-label="Ending weather">
      </div>

      <textarea id="notes" class="longNote" placeholder="Notes"
        aria-label="Survey notes">
      </textarea>

    </div>
  </div> <!-- #notesView -->

  <script src="shell-config.js"></script>
  <script src="app.js"></script>

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        await navigator.serviceWorker.register('./sw.js');
        console.log('Service worker registered');
      } catch (err) {
        console.error( 'SW registration failed', err);
      }
    });
  }
</script>

</body>
</html>
