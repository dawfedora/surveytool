name: Deploy site

on:
  push:
    branches:
      - main
      - dev
      - beta
      - alpha

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install ImageMagick
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Check ImageMagick
        run: |
          magick --version || true
          convert --version || true

      - name: Generate version.json and sw.js
        run: |
          bash deploy.bash

      - name: Prepare files
        run: |
          # Get branch name reliably (github.ref is like refs/heads/<branch>)
          BRANCH="${GITHUB_REF_NAME}"
          echo "Branch detected: $BRANCH"

          # temp and output dirs
          rm -rf publish-temp publish
          mkdir -p publish-temp publish

          # Export the repo contents to publish-temp excluding the git metadata and .github
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.gitattributes' \
            --exclude 'publish' \
            ./ publish-temp/

          # Copy entire directory (including dotfiles) into publish or subdir depending on the branch
          if [ "$BRANCH" = "main" ]; then
            rsync -a --delete publish-temp/ publish/
          elif [ "$BRANCH" = "dev" ]; then
            mkdir -p publish/dev
            rsync -a --delete publish-temp/ publish/dev/
          elif [ "$BRANCH" = "beta" ]; then
            mkdir -p publish/beta
            rsync -a --delete publish-temp/ publish/beta/
          elif [ "$BRANCH" = "alpha" ]; then
            mkdir -p publish/alpha
            rsync -a --delete publish-temp/ publish/alpha/
          else
            echo "Branch '$BRANCH' not configured for publishing — publish will be empty."
          fi

          # Debug output - show what will be published
          echo "===== publish directory listing ====="
          ls -la publish || true
          echo "===== publish content tree ====="
          find publish -maxdepth 3 -type f -print || true

      - name: Fail if publish is empty
        run: |
          if [ ! -d publish ] || [ -z "$(ls -A publish 2>/dev/null)" ]; then
            echo "ERROR: publish directory is missing or empty. Nothing to publish."
            echo "Workspace root listing:"
            ls -la
            echo "publish-temp listing:"
            ls -la publish-temp || true
            exit 1
          fi

      - name: Verify required website files
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          if [ "$BRANCH" = "main" ]; then
            TARGET="publish"
          else
            TARGET="publish/$BRANCH"
          fi

          for file in \
            index.html \
            app.js \
            shell-config.js \
            version.json \
            sw.js \
            manifest.json \
            data/plants.json \
            data/trails.json \
            data/participants.json \
            icons/foe-logo.png \
            icons/foe-icon-192.png \
            icons/foe-icon-512.png
          do
            if [ ! -f "$TARGET/$file" ]; then
              echo "ERROR: missing $TARGET/$file"
              exit 1
            fi
          done

      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: publish
          keep_files: true
