<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0,viewport-fit=cover"
  >

  <title>Edgewood Survey Tool</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="./icons/foe-icon-192.png">
  <link rel="apple-touch-icon" href="./icons/foe-icon-192.png">

  <meta name="theme-color" content="#4a7c59">

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SurveyTool">

  <!-- Older Android support -->
  <meta name="mobile-web-app-capable" content="yes">

<!-- CSS -->
  <style>

/* Base */
    html, body {
      touch-action: manipulation;
      height: 100%;
      overflow: hidden;
    }

    [hidden] {
      display: none !important;
    }

    body {
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      font-size: 16px;
      margin: 0;
      padding-top: calc(env(safe-area-inset-top) + 8px);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: 8px;
      padding-right: 8px;
      min-height: 100%;
    }

    #globalHeader {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* top row */
    .headerTop {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

/* logo + title group */
    .headerIdentity {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .headerMeta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      line-height: 1.1;
      text-align: right;
    }

    #version {
      font-size: 0.8rem;
      white-space: nowrap;
    }

    #status {
      font-size: 0.9rem;
    }

    #foeLogo {
      height: 38px;
      width: auto;
      display: block;
    }

    .title {
      font-size: 16px;
      line-height: 1;
      font-weight: 600;
    }

    /* bottom row */
    .headerActions {
      display: flex;
      flex-wrap: wrap;   /* allows graceful wrap instead of breaking layout */
      gap: 4px;
    }

    .headerActions button {
      padding: 4px 8px;
      font-size: 0.8em;
    }

/* messages */
    #stateMessagePanel {
      padding: 8px 10px;
      border: 1px solid #d8b45a;
      background: #fff7d6;
      font-size: 0.9rem;
      line-height: 1.25;
    }

    /* if we decide we need #messagePanel, it goes here */

    #bootFallback {
      visibility: hidden;
      animation: showBootFallback 0s 750ms forwards;
    }

    @keyframes showBootFallback {
      to {
        visibility: visible;
      }
    }

/* logView */

    #logView {
      position: relative;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    #searchArea {
      position: relative;
      flex: 0 0 auto;
      background: #f5f5f5;
      padding-top: 6px;
      z-index: 100;
    }

    #search {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      padding: 6px 38px 6px 10px;
      margin-bottom: 6px;
    }

    #clearSearch {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      font-size: 22px;
      padding: 6px;
      cursor: pointer;
    }

    #logTrailSelect {
      flex: 0 0 auto;
    }

    #log {
      flex: 1 1 auto;
      overflow-y: auto;
      min-height: 0;
    }

    .item {
      padding: 10px;
      border-bottom: 1px solid #eee;
      line-height: 1.3;
    }

    .resultItem {
      padding: 12px 10px;
      line-height: 1.25;
      border-bottom: 1px solid #ddd;
      background: #f8fbff;
    }

    #results {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 1000;
      overflow-y: auto;
      background: #eef5ff;
      display: none;
    }

    #results:not(:empty) {
      display: block;
    }

    .common {
      font-weight: bold;
      margin-right: 6px;
    }

    .scientific {
      font-style: italic;
    }

    .logRow {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    
    .logNote {
      flex: 0 1 auto;

      min-width: 5ch;
      max-width: 50%;

      resize: none;
      overflow: hidden;
      font: inherit;
      line-height: inherit;
      white-space: pre;
      overflow-wrap: anywhere;
      padding-top: 0;
      padding-bottom: 0;
      padding-left: 4px;
      padding-right: 4px;

      box-sizing: border-box;
      vertical-align: top;
    }

    /* "x" delete button for log entries */
    .deleteBtn {
      flex: 0 0 auto;
      font-size: 18px;
      padding: 2px 8px;
      margin-left: 4px;
      border: none;
      border-radius: 6px;
      background: #eee;
      color: #900;
      cursor: pointer;
    }

    textarea,
    select,
    input {
      font-size: 16px;
      width: 100%;
    }

    select, input {
      padding: 12px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    textarea {
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      resize: vertical;
    }

    .resultItem .scientific {
      font-size: 0.9em;
    }

    .resultItem:active {
      background: #dcecff;
    }

    .activeNoteBtn {
      background: #dcecff;
    }

    .item:last-child {
      border-bottom: none;
    }

/* Notes View */

    #notesView {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .noteActions {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .noteActions button {
      padding: 4px 8px;
      font-size: 0.8em;
    }

    .longNote {
      min-height: 8em;
    }

    .participantResults {
      position: absolute;
      left: 0;
      right: 0;
      background: #eef5ff;
      border: 1px solid #ccc;
      max-height: 200px;
      overflow-y: auto;
      z-index: 2000;
    }
    .participantWrapper {
      position: relative;
    }
    #participants {
      width: 100%;
      resize: vertical;
      min-height: 2.5em;
    }

/* Choice dialog */
    .choiceOverlay {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: calc(env(safe-area-inset-top) + 72px) 12px 12px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.18);
    }

    .choicePanel {
      width: min(100%, 360px);
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: white;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22);
    }

    .choiceQuestion {
      margin-bottom: 10px;
      font-weight: 600;
    }

    .choiceButtons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

/* Feedback / Utility */
    .inputRejected {
      background: #ffeaea;
    }

  </style>
</head>

<body autocorrect="off" spellcheck="false">

  <div id="bootFallback">
    Survey Tool did not finish loading.
    Find network coverage and reopen the app.
  </div>

  <div id="globalHeader" hidden>

    <div class="headerTop">
      <div class="headerIdentity">
        <img id="foeLogo" src="./icons/foe-logo.png" alt="FoE logo">
        <div class="title">Survey Tool</div>
      </div>

      <div class="headerMeta">
        <div id="version"></div>
        <div id="status"></div>
      </div>
    </div>

    <div class="headerActions">
      <button id="modeBtn" hidden>Notes</button>
      <button id="newBtn" hidden>New Survey</button>
      <button id="refreshBtn" hidden>Refresh</button>
      <button id="endBtn" hidden>End</button>
      <button id="saveBtn" hidden>Save</button>
      <button id="importBtn" hidden>Import</button>
      <input id="importInput" type="file" accept="application/json,.json"
        autocapitalize="none" hidden>
    </div>

  </div> <!-- #globalHeader -->

  <div id="messagePanel" hidden>
    <span id="messageText"></span>
    <button id="dismissMessageBtn"
      aria-label="Dismiss message">
      x 
    </button>
  </div>

  <div id="stateMessagePanel" hidden></div>


  <div id="logView" hidden>

    <!-- search stays fixed under header -->
    <div id="searchArea">
      <input
        disabled
        id="search"
        type="text"
        placeholder="Search plant..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      >
      <button id="clearSearch" type="button" aria-label="Clear search">
        X
      </button>
    </div>

    <!-- normal content -->
    <select id="logTrailSelect"></select>

    <div id="log"></div>

    <!-- overlays selector + log -->
    <div id="results"></div>

  </div> <!-- #logView -->

  <div id="notesView" hidden>

      <!-- notes buttons -->
    <div class = "noteActions">
      <button id="startBtn">Start Note</button>
      <button id="trailBtn">Trail Notes</button>
      <button id="closeBtn">Closing Note</button>
    </div>

    <div id="startPanel">
      <input id="startDate">
      <input id="startTime">
      <input id="startWeather" autocapitalize="none"
        placeholder="75 F, partly cloudy">

      <div class="participantWrapper">

        <textarea id="participants"
          autocapitalize="words"
          rows="2"
          placeholder="Participants"
        ></textarea>

        <div id="participantResults"
          class="participantResults">
        </div>
      </div>
      <textarea id="startNote" class="longNote" autocapitalize="none"
        placeholder="Starting notes"></textarea>
    </div>

    <div id="trailPanel" hidden>
      <select id="notesTrailSelect"></select>
      <textarea id="trailNotes" class="longNote" autocapitalize="none"
        placeholder="Notes..." ></textarea>
    </div>

    <div id="closePanel"  hidden>
      <input id="closeTime">
      <input id="closeWeather" autocapitalize="none"
        placeholder="82 F, sunny">	
      <textarea id="closeNote" class="longNote" autocapitalize="none"
        placeholder="Closing notes"></textarea>
    </div>

  </div> <!-- #notesView -->

  <script src="shell-config.js"></script>
  <script src="app.js"></script>

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        await navigator.serviceWorker.register('./sw.js');
        console.log('Service worker registered');
      } catch (err) {
        console.error( 'SW registration failed', err);
      }
    });
  }
</script>

</body>
</html>
